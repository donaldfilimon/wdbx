[package]
name = "wdbx-studio-desktop"
version = "0.2.0"
edition = "2024"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
specimen-core = { path = "../native/specimen-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tauri-plugin-dialog = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
[dependencies.tauri-plugin-wdio]
version = "1.3.0"
optional = true
[dependencies.tauri-plugin-wdio-webdriver]
version = "1.3.0"
optional = true
