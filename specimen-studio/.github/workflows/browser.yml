name: Browser qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: >
      github.repository == 'donaldfilimon/wdbx-specimen-studio' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    # Trusted events only (push to main, dispatch), so every leg runs on the
    # macOS arm64 self-hosted runner registered to this repository. The host
    # provides Google Chrome for the chrome leg. See docs/SelfHostedRunner.md.
    runs-on: [self-hosted, macOS, ARM64, wdbx-specimen-studio]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run lint:studio
      - run: bun run build
      - name: Provide Playwright browser
        env:
          STUDIO_BROWSER: ${{ matrix.browser }}
        run: |
          if [ "$STUDIO_BROWSER" = chrome ]; then
            # On macOS, `playwright install chrome` runs `sudo rm -rf` on
            # /Applications/Google Chrome.app and copies in a fresh one (CI=true
            # forces the reinstall). The runner has no sudo and must not replace
            # the host's browser, so the host provides Google Chrome instead.
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          else
            # Per-user download into ~/Library/Caches/ms-playwright. --with-deps
            # only installs apt packages on Linux and does nothing on macOS.
            bunx playwright install "$STUDIO_BROWSER"
          fi
      - name: Qualify production browser runtime
        env:
          STUDIO_BROWSER: ${{ matrix.browser }}
          STUDIO_URL: http://127.0.0.1:4176
        run: |
          mkdir -p work
          bun start --ip 127.0.0.1 --port 4176 > work/browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent "$STUDIO_URL" > /dev/null; then ready=1; break; fi
            kill -0 "$server_pid" || exit 1
            sleep 1
          done
          test "$ready" = 1
          bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}-${{ github.sha }}
          path: |
            work/*-${{ matrix.browser }}.json
            work/*-${{ matrix.browser }}.png
            work/browser-server.log
