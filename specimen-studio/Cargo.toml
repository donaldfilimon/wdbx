[workspace]
members = ["native/specimen-kernel", "native/specimen-core", "native/specimen-wasm", "native/specimen-tui", "src-tauri"]
resolver = "2"
default-members = ["src-tauri"]
exclude = ["native/vendor"]
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
[profile.dev]
debug = 0
[profile.release]
strip = true
codegen-units = 8

[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[patch.crates-io]
glib = { path = "native/vendor/glib-0.18.5" }
glib-macros = { path = "native/vendor/glib-macros-0.18.5" }
gtk3-macros = { path = "native/vendor/gtk3-macros-0.18.2" }

[profile.dev.package."glib@0.18.5"]
opt-level = 3
