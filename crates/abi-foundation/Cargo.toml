[package]
name = "abi-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared primitives for the ABI framework: errors, env, time, JSON escaping, validation, logging, credentials, IO and HTTP helpers."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

# macOS login-keychain backend (opt-in via ABI_CREDENTIALS_BACKEND=keychain).
# This stays macOS-only so adding the explicit Linux provider below does not
# silently change the auth backend selected by existing users.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Explicit Linux Secret Service provider. The pure-Rust crypto feature protects
# secret payloads on the in-process D-Bus session without an OpenSSL/libdbus
# build dependency. This provider is additive and is not the default auth store.
[target.'cfg(target_os = "linux")'.dependencies]
# Upstream PR #122 migrates off the unmaintained zbus 5 type crates while
# retaining the blocking API used here. Pin the reviewed commit until a
# compatible 6.x release is published: https://github.com/hwchen/secret-service-rs/pull/122
secret-service = { git = "https://github.com/hwchen/secret-service-rs.git", rev = "7a91b597904c1847f18a06b72a19ee8153e0a578", version = "6.0.0", default-features = false, features = ["rt-async-io-crypto-rust"] }

# Owner-only DACL on the credential file, replacing the hand-written advapi32
# externs in credentials_file.zig. See src/credentials/windows_acl.rs.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
]

[lints]
workspace = true
