[package]
name = "specimen-core"
version = "0.2.0"
edition = "2024"
[dependencies]
abi-wdbx = { git = "https://github.com/donaldfilimon/wdbx", rev = "e55634cbb581c1de02f946a29c34db8cf5203704" }
abi-compute = { git = "https://github.com/donaldfilimon/wdbx", rev = "e55634cbb581c1de02f946a29c34db8cf5203704" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
sha2.workspace = true
sysinfo = "0.37"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ocrs = "0.12.2"
rten = "0.24"
wgpu = "0.19"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
[dev-dependencies]
tempfile = "3"
