name: Browser qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run lint:studio
      - run: bun run build
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Qualify production browser runtime
        env:
          STUDIO_BROWSER: ${{ matrix.browser }}
          STUDIO_URL: http://127.0.0.1:4176
        run: |
          mkdir -p work
          bun start --ip 127.0.0.1 --port 4176 > work/browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent "$STUDIO_URL" > /dev/null; then ready=1; break; fi
            kill -0 "$server_pid" || exit 1
            sleep 1
          done
          test "$ready" = 1
          bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}-${{ github.sha }}
          path: |
            work/*-${{ matrix.browser }}.json
            work/*-${{ matrix.browser }}.png
            work/browser-server.log
