name: Native desktop qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      models:
        description: Run real local text inference qualification
        type: boolean
        default: false
concurrency:
  group: native-${{ github.ref }}-${{ inputs.models && 'models' || 'desktop' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  desktop:
    if: ${{ !inputs.models }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xvfb
      - name: Rust toolchain
        run: rustup toolchain install nightly-2026-09-01 --profile minimal --component rustfmt --component clippy
      - name: Dependencies
        run: bun install --frozen-lockfile
      - name: Browser unit tests and types
        run: |
          bun test
          bunx tsc --noEmit
          bun run lint:studio
      - name: Native conformance tests
        run: cargo test -p specimen-core --locked
      - name: Reuse pinned inference builds
        uses: actions/cache@v4
        with:
          path: |
            work/runtimes
            src-tauri/binaries
          key: native-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/runtime-pins.json', 'scripts/build-runtimes.py') }}
          restore-keys: native-runtimes-${{ runner.os }}-${{ runner.arch }}-
      - name: Build model runtimes
        run: python scripts/build-runtimes.py
      - name: Native warnings-denied gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check portable Windows model runtimes
        if: runner.os == 'Windows'
        run: python scripts/check-windows-runtimes.py
      - name: Package desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            bunx tauri build --bundles deb
            mkdir -p work/linux-deb-stage
            cp -p target/release/wdbx-studio-desktop work/linux-deb-stage/
            cp -p src-tauri/binaries/llama-server src-tauri/binaries/sd-cli work/linux-deb-stage/
            bunx tauri bundle --bundles rpm,appimage
          else
            bunx tauri build
          fi
      - name: Verify production bridge exclusion
        run: python scripts/check-production-bridge.py
      - name: Desktop invocation tests
        run: cargo test -p wdbx-studio-desktop --locked
      - name: Seal macOS installer
        if: runner.os == 'macOS'
        run: python3 scripts/seal-macos-package.py
      - name: Record package qualification
        shell: bash
        env:
          WDBX_RUNNER_LABEL: ${{ matrix.os }}
        run: |
          shopt -s nullglob
          case "$RUNNER_OS" in
            macOS)
              application='target/release/bundle/macos/WDBX Specimen Studio.app/Contents/MacOS/wdbx-studio-desktop'
              helpers=('target/release/bundle/macos/WDBX Specimen Studio.app/Contents/Resources/binaries/llama-server' 'target/release/bundle/macos/WDBX Specimen Studio.app/Contents/Resources/binaries/sd-cli')
              installers=(target/release/bundle/dmg/*.dmg)
              ;;
            Windows)
              application='target/release/wdbx-studio-desktop.exe'
              helpers=(src-tauri/binaries/llama-server.exe src-tauri/binaries/sd-cli.exe)
              installers=(target/release/bundle/nsis/*.exe)
              ;;
            Linux)
              application='target/release/wdbx-studio-desktop'
              helpers=(src-tauri/binaries/llama-server src-tauri/binaries/sd-cli)
              installers=(target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb)
              ;;
          esac
          arguments=(create --root "$PWD" --output work/package-qualification.json --head-sha "$GITHUB_SHA" --workflow-run-id "$GITHUB_RUN_ID" --runner-label "$WDBX_RUNNER_LABEL" --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" --application "$application")
          for helper in "${helpers[@]}"; do arguments+=(--helper "$helper"); done
          for installer in "${installers[@]}"; do arguments+=(--installer "$installer"); done
          python scripts/package-evidence.py "${arguments[@]}"
          if [ "$RUNNER_OS" = Linux ]; then
            appimages=(target/release/bundle/appimage/*.AppImage)
            debians=(target/release/bundle/deb/*.deb)
            if [ "${#appimages[@]}" -ne 1 ]; then
              echo "Expected exactly one AppImage for staged qualification" >&2
              exit 1
            fi
            python scripts/linux_package_evidence.py create \
              --root "$PWD" \
              --base-receipt "$PWD/work/package-qualification.json" \
              --appdir "$PWD/target/release/bundle/appimage/WDBX Specimen Studio.AppDir" \
              --installer "$PWD/${appimages[0]}" \
              --output "$PWD/work/linux-appdir-qualification.json" \
              --retained-payload "$PWD/work/linux-appdir-payload" \
              --expected-source-sha "$GITHUB_SHA" \
              --expected-run-id "$GITHUB_RUN_ID"
            if [ "${#debians[@]}" -ne 1 ]; then
              echo "Expected exactly one Debian installer for staged qualification" >&2
              exit 1
            fi
            python scripts/linux_package_evidence.py create-deb \
              --root "$PWD" \
              --base-receipt "$PWD/work/package-qualification.json" \
              --staged-payload "$PWD/work/linux-deb-stage" \
              --installer "$PWD/${debians[0]}" \
              --output "$PWD/work/linux-deb-qualification.json" \
              --retained-payload "$PWD/work/linux-deb-payload" \
              --expected-source-sha "$GITHUB_SHA" \
              --expected-run-id "$GITHUB_RUN_ID"
          fi
          mkdir -p work/qualified-payload
          for payload in "$application" "${helpers[@]}"; do
            destination="work/qualified-payload/$(basename "$payload")"
            if [ -e "$destination" ]; then
              echo "Refusing duplicate qualified payload basename: $destination" >&2
              exit 1
            fi
            cp -p "$payload" "$destination"
          done
      - name: Qualify installed Linux packages
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/check-linux-packages.py
      - name: Test application assets
        shell: bash
        run: VITE_NATIVE_E2E=1 bun run desktop:build
      - name: Build instrumented native test app
        shell: bash
        run: TAURI_CONFIG="$(cat src-tauri/tauri.e2e.conf.json)" cargo build -p wdbx-studio-desktop --features e2e,custom-protocol
      - name: Create visual fixture
        run: |
          python -m pip install pillow
          python scripts/ocr-fixture.py work/acceptance
      - name: Native interface tests
        shell: bash
        run: |
          mkdir -p work
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            WDBX_STUDIO_TEST_DATA="$PWD/work/native-e2e" xvfb-run -a bunx wdio run wdio.conf.mjs 2>&1 | tee work/native-e2e.log
          else
            WDBX_STUDIO_TEST_DATA="$PWD/work/native-e2e" bunx wdio run wdio.conf.mjs 2>&1 | tee work/native-e2e.log
          fi
      - name: Upload installers and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdbx-studio-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            work/package-qualification.json
            work/qualified-payload/*
            work/production-bridge-verification.json
            work/native-first-screen.png
            work/native-desktop.png
            work/native-e2e.log
            work/native-ui-evidence.json
            work/linux-package-verification.json
            work/linux-appdir-qualification.json
            work/linux-appdir-payload/*
            work/linux-deb-qualification.json
            work/linux-deb-payload/*
            work/*-launch.log
          if-no-files-found: warn

  text-model:
    if: ${{ inputs.models }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install nightly-2026-09-01 --profile minimal
      - name: Build pinned text runtime
        run: python3 scripts/build-runtimes.py --only llama
      - name: Download verified Qwen model
        run: python3 scripts/download-models.py work/acceptance/models --ids qwen3-4b
      - name: Real CPU text inference
        run: cargo run --locked --release -p specimen-core --example acceptance -- "$PWD/work/acceptance" "$PWD/src-tauri/binaries" text
      - name: Record text inference receipt
        run: |
          result_sha=$(shasum -a 256 work/acceptance/results/text.json | awk '{print $1}')
          jq -n \
            --arg headSha "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg runner "$RUNNER_OS/$RUNNER_ARCH" \
            --arg resultSha256 "$result_sha" \
            '{schema:1,headSha:$headSha,workflowRunId:$workflowRunId,runner:$runner,mode:"text",resultSha256:$resultSha256}' \
            > work/acceptance/results/run-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-text-inference
          path: work/acceptance/results
