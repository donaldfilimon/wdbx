name: Windows portable runtime packaging
on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful native desktop qualification workflow run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      WDBX_QUALIFICATION_RUN: ${{ inputs.qualification_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Rust metadata toolchain
        run: rustup toolchain install nightly-2026-09-01 --profile minimal
      - name: Dependencies
        run: bun install --frozen-lockfile
      - name: Reuse pinned inference builds
        uses: actions/cache@v4
        with:
          path: |
            work/runtimes
            src-tauri/binaries
          key: native-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/runtime-pins.json', 'scripts/build-runtimes.py') }}
          restore-keys: native-runtimes-${{ runner.os }}-${{ runner.arch }}-
      - name: Build standalone Windows model runtimes
        run: python scripts/build-runtimes.py
      - name: Save completed standalone helpers
        uses: actions/cache/save@v4
        with:
          path: |
            work/runtimes
            src-tauri/binaries
          key: native-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/runtime-pins.json', 'scripts/build-runtimes.py') }}
      - name: Verify helper imports and isolated startup
        run: python scripts/check-windows-runtimes.py
      - name: Restore current-head qualified application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:WDBX_QUALIFICATION_RUN -notmatch '^\d+$') {
            throw 'qualification_run_id must be numeric'
          }
          gh run download $env:WDBX_QUALIFICATION_RUN `
            -n wdbx-studio-windows-2022 `
            -D work/qualified-application
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download qualified application' }
          $receipts = @(Get-ChildItem work/qualified-application -Recurse -Filter package-qualification.json)
          if ($receipts.Count -ne 1) { throw 'Qualified artifact must contain exactly one receipt' }
          $receiptPath = $receipts[0].FullName
          $receiptRelative = [IO.Path]::GetRelativePath(
            (Resolve-Path work/qualified-application),
            $receiptPath
          )
          python scripts/package-evidence.py verify `
            --root work/qualified-application `
            --receipt $receiptRelative `
            --expected-head-sha $env:GITHUB_SHA `
            --expected-run-id $env:WDBX_QUALIFICATION_RUN `
            --expected-runner-label windows-2022 `
            --required-helper llama-server.exe `
            --required-helper sd-cli.exe `
            --file-scope installers
          if ($LASTEXITCODE -ne 0) { throw 'Package qualification receipt was rejected' }
          $receipt = Get-Content $receiptPath -Raw | ConvertFrom-Json
          $installerRecords = @($receipt.installers | Where-Object { $_.path.EndsWith('.exe') })
          if ($installerRecords.Count -ne 1) { throw 'Qualification receipt must name one NSIS installer' }
          $installer = Join-Path work/qualified-application $installerRecords[0].path
          7z x $installer -owork/qualified-extracted -y
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract qualified application' }
          $app = 'work/qualified-extracted/wdbx-studio-desktop.exe'
          $appHash = (Get-FileHash $app -Algorithm SHA256).Hash.ToLower()
          if ($appHash -ne $receipt.application.sha256) {
            throw 'Qualified application digest differs from receipt'
          }
          foreach ($helper in $receipt.helpers) {
            $helperPath = Join-Path work/qualified-extracted "binaries/$($helper.name)"
            if (-not (Test-Path $helperPath)) { throw "Qualified helper is missing: $($helper.name)" }
            $helperHash = (Get-FileHash $helperPath -Algorithm SHA256).Hash.ToLower()
            if ($helperHash -ne $helper.sha256) {
              throw "Qualified helper digest differs: $($helper.name)"
            }
          }
          New-Item target/release -ItemType Directory -Force | Out-Null
          Copy-Item $app target/release/wdbx-studio-desktop.exe
          Copy-Item $receiptPath work/package-qualification.json
      - name: Bundle verified app and standalone helpers
        run: bunx tauri bundle --bundles nsis --ci
      - name: Verify final installer payload
        shell: pwsh
        run: |
          $receipt = Get-Content work/package-qualification.json -Raw | ConvertFrom-Json
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter *.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one final NSIS installer' }
          $installer = $installers[0]
          7z x $installer.FullName -owork/final-installer -y
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract final installer' }
          $app = 'work/final-installer/wdbx-studio-desktop.exe'
          $appHash = (Get-FileHash $app -Algorithm SHA256).Hash.ToLower()
          if ($appHash -ne $receipt.application.sha256) {
            throw 'Final application digest differs from qualified application'
          }
          $helperEvidence = @()
          foreach ($name in @('llama-server.exe', 'sd-cli.exe')) {
            $built = (Get-FileHash "src-tauri/binaries/$name" -Algorithm SHA256).Hash.ToLower()
            $packed = (Get-FileHash "work/final-installer/binaries/$name" -Algorithm SHA256).Hash.ToLower()
            if ($built -ne $packed) { throw "Packaged helper differs: $name" }
            $helperEvidence += @{name=$name; sha256=$packed}
          }
          @{
            schema=1
            sourceSha=$env:GITHUB_SHA
            qualificationRunId=$env:WDBX_QUALIFICATION_RUN
            qualificationRunner='windows-2022'
            qualifiedInstallerSha256=$receipt.installers[0].sha256
            applicationSha256=$appHash
            applicationUnchanged=$true
            helpers=$helperEvidence
            finalInstaller=@{
              path=[IO.Path]::GetRelativePath((Resolve-Path .), $installer.FullName)
              sha256=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
            }
          } | ConvertTo-Json -Depth 5 | Set-Content work/windows-package-verification.json
      - name: Upload portable installer and evidence
        uses: actions/upload-artifact@v4
        with:
          name: wdbx-studio-windows-portable
          path: |
            target/release/bundle/nsis/*.exe
            work/package-qualification.json
            work/windows-runtime-verification.json
            work/windows-package-verification.json
