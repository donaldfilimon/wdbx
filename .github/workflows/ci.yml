name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (instructions, sizes, fmt, clippy, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workspace is self-contained: the five crates depend only on each
      # other and on crates.io, so no sibling checkout is needed here. Consumers
      # (abi, abbey) are the ones that need this repository beside them.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-09-01
          components: rustfmt, clippy

      # tools/check.sh is the contract: agent-instruction pointer check, Rust
      # source size limit, cargo fmt --check, cargo clippy --workspace
      # --all-targets, cargo test --workspace.
      # The workspace denies unsafe_code and all of clippy, and warns on
      # missing_docs and clippy pedantic, so clippy runs without -D warnings.
      - name: gate
        run: bash tools/check.sh
