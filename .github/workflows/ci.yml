name: CI

# Trusted same-repo events (push, workflow_dispatch, same-repo PRs) run on the
# macOS arm64 self-hosted runner registered to this repository with the label
# wdbx. Fork PRs stay on GitHub-hosted runners only: never schedule untrusted
# code on the self-hosted machine. Runner setup: docs/SelfHostedRunner.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (instructions, sizes, fmt, clippy, test)
    if: >
      github.repository == 'donaldfilimon/wdbx' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, wdbx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workspace is self-contained: the five crates depend only on each
      # other and on crates.io, so no sibling checkout is needed here. Consumers
      # (abi, abbey) are the ones that need this repository beside them.
      # The action installs rustup into ~/.cargo when the host lacks it.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-09-01
          components: rustfmt, clippy

      # A developer Mac often has Homebrew's cargo on PATH ahead of rustup's
      # shims. That cargo is a real binary that ignores rust-toolchain.toml, so
      # put rustup's shims first and fail if another cargo still wins.
      - name: Use the rustup toolchain, not a Homebrew cargo
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          test "$(command -v cargo)" = "$CARGO_HOME/bin/cargo"
          rustup show active-toolchain
          cargo --version

      # tools/check.sh is the contract: agent-instruction pointer check, Rust
      # source size limit, cargo fmt --check, cargo clippy --workspace
      # --all-targets, cargo test --workspace.
      # The workspace denies unsafe_code and all of clippy, and warns on
      # missing_docs and clippy pedantic, so clippy runs without -D warnings.
      # cargo test needs python3 on PATH (Xcode Command Line Tools provide it).
      - name: gate
        run: bash tools/check.sh

  gate-hosted:
    name: gate (instructions, sizes, fmt, clippy, test) (GitHub-hosted, fork PRs)
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This workspace is self-contained: the five crates depend only on each
      # other and on crates.io, so no sibling checkout is needed here. Consumers
      # (abi, abbey) are the ones that need this repository beside them.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-09-01
          components: rustfmt, clippy

      # tools/check.sh is the contract: agent-instruction pointer check, Rust
      # source size limit, cargo fmt --check, cargo clippy --workspace
      # --all-targets, cargo test --workspace.
      # The workspace denies unsafe_code and all of clippy, and warns on
      # missing_docs and clippy pedantic, so clippy runs without -D warnings.
      - name: gate
        run: bash tools/check.sh
